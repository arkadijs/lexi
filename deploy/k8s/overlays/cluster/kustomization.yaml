# For a cluster without an image registry: the image is built with docker on the node and imported into the
# kubelet's containerd (scripts/deploy.sh), hence imagePullPolicy Never. The public hostname is not set here: the
# deploy script replaces the placeholder `lexi.example.com` in the rendered manifests with $LEXI_SERVICE_HOST.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../prod]
images:
  - name: lexi
    newName: lexi
    newTag: local   # replaced by scripts/deploy.sh with the git short SHA
patches:
  - target: { kind: Deployment, name: lexi }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/imagePullPolicy, value: Never }
