# No ingressClassName (the cluster's default ingress controller, Contour in the original setup) + cert-manager.
# The ClusterIssuer name and the host are substituted by scripts/deploy.sh (LEXI_CERT_ISSUER, LEXI_SERVICE_HOST).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lexi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
    - host: lexi.example.com   # placeholder, replaced by scripts/deploy.sh
      http:
        paths:
          - path: /v1/call-token
            pathType: Exact
            backend: { service: { name: lexi, port: { name: http } } }
          - path: /v1/search
            pathType: Exact
            backend: { service: { name: lexi, port: { name: http } } }
  tls:
    - hosts: [lexi.example.com]
      secretName: lexi-cert
