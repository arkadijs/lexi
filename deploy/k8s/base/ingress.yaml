# Contour (no ingressClassName, matching the other apps on the cluster) + cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lexi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
    - host: lexi.example.com   # overridden per overlay
      http:
        paths:
          - path: /v1/call-token
            pathType: Exact
            backend: { service: { name: lexi, port: { name: http } } }
          - path: /v1/search
            pathType: Exact
            backend: { service: { name: lexi, port: { name: http } } }
  tls:
    - hosts: [lexi.example.com]
      secretName: lexi-cert
