apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lexi
labels:
  - pairs: { app.kubernetes.io/name: lexi, app.kubernetes.io/part-of: lexi }
    includeSelectors: false
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
configMapGenerator:
  - name: lexi-env
    literals:
      - LEXI_MODEL=gpt-realtime-2.1-mini
      - LEXI_VOICE=cedar
      - LEXI_REASONING_EFFORT=low
      - LEXI_VAD_SILENCE_MS=400
      - LEXI_TOKEN_TTL_SECS=60
      - LEXI_INSTRUCTIONS_FILE=/etc/lexi/instructions.txt
      - LEXI_ATTEST_MODE=off
      - LEXI_TRUST_FORWARDED_FOR=false
  - name: lexi-instructions
    files: [instructions.txt]
# The Secret `openai-api-key` (key OPENAI_API_KEY) is referenced, never committed:
#   kubectl -n lexi create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
