[package]
name = "lexi-minter"
description = "Ephemeral-token minting service for the OpenAI Realtime API (SPEC §5)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
play-integrity = []

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
governor = { version = "0.10.4", default-features = false, features = ["std"] }
hmac = "0.13.0"
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", default-features = false, features = ["request-id", "trace", "timeout", "limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["json", "fmt", "env-filter", "registry", "std"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
wiremock = "0.6.5"
