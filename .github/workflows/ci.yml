name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          kubeconform: "0.6.7"
      - name: kustomize build | kubeconform
        run: |
          for o in prod remote; do
            kubectl kustomize deploy/k8s/overlays/$o | kubeconform -strict -summary -ignore-missing-schemas
          done
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Multi-arch build check (not pushed).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Single-arch image loaded locally for the vulnerability scan and size check.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: lexi:ci
          cache-from: type=gha
      - name: image < 15 MB
        run: test "$(docker image inspect lexi:ci --format '{{.Size}}')" -lt 15000000
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lexi:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
