[package]
name = "lexi-core"
description = "Lexi Rust core: WebRTC, audio, codec, render (SPEC §4)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lexi_core"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
log = "0.4.35"
hmac = "0.13.0"
if-addrs = "0.15.0"
opus = "0.4.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
jni = "0.22.4"
ndk = { version = "0.9.0", default-features = false, features = ["audio", "api-level-31"] }
