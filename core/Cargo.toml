[package]
name = "lexi-core"
description = "Lexi Rust core: WebRTC, audio, codec, render (SPEC §4)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lexi_core"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
log = "0.4.35"
hmac = "0.13.0"
if-addrs = "0.15.0"
opus = "0.4.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "json"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1.0.12"
base64 = "0.23.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
glow = { version = "0.18.0", default-features = false }
jni = "0.22.4"
khronos-egl = { version = "6.0.0", default-features = false, features = ["1_5", "static", "no-pkg-config"] }
ndk = { version = "0.9.0", default-features = false, features = ["audio", "api-level-31"] }
ndk-sys = "0.6.0"
